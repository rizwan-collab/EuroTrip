name: Drive sync loop
# Keeps watching the "EuroTrip Hub Sync" Drive folder every 3 minutes for about 5.5 hours,
# then restarts itself. The schedule below is only a backup in case the chain ever stops.
on:
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: drive-loop
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Watch Drive and publish
        env:
          FOLDER: 1fFECJ8kPrnu70t-xlB6JGoh5_KoiK8jh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > /tmp/sync.sh <<'SH'
          set -euo pipefail
            git pull -q --rebase origin main
            mkdir -p .sync
            SEQ=$(cat .sync/seq 2>/dev/null || echo 0)
            curl -fsSL "https://drive.google.com/embeddedfolderview?id=$FOLDER" -o /tmp/list.html
            python3 - "$SEQ" > /tmp/todo.txt <<'PY'
          import re, sys
          seq = int(sys.argv[1])
          h = open('/tmp/list.html', encoding='utf-8').read()
          items = re.findall(r'/file/d/([\w-]+)/view.*?flip-entry-title">([^<]+)<', h, re.S)
          out = {}
          for fid, name in items:
              m = re.fullmatch(r'([pf])(\d{4})\.(patch|b64)', name.strip())
              if m and int(m.group(2)) > seq:
                  out[int(m.group(2))] = (m.group(1), fid)
          for n in sorted(out):
              print(n, *out[n])
          PY
            [ -s /tmp/todo.txt ] || exit 0
            cat /tmp/todo.txt
            while read -r N KIND FID; do
              curl -fsSL "https://drive.google.com/uc?export=download&id=$FID" -o /tmp/upd
              if [ "$KIND" = p ]; then git apply --whitespace=nowarn /tmp/upd
              else base64 -d /tmp/upd | tar xz; fi
              grep -q '</html>' europe_trip_planner.html
              grep -q 'var BUILD = "' europe_trip_planner.html
              echo "$N" > .sync/seq
            done < /tmp/todo.txt
            git add -A
            git commit -qm "Drive sync to update $(cat .sync/seq)"
            git push -q
            echo "Published update $(cat .sync/seq)"
          SH
          END=$(( $(date +%s) + 330*60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            bash /tmp/sync.sh || { echo "::warning::Sync attempt failed, will retry"; git reset -q --hard origin/main || true; }
            sleep 180
          done
      - name: Restart the loop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run drive-loop.yml --ref main -R "$GITHUB_REPOSITORY"
