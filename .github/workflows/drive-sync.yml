name: Drive sync
# Pulls hub updates that Claude drops in the "EuroTrip Hub Sync" Drive folder
# (pNNNN.patch = git diff, fNNNN.b64 = base64 tar.gz of full files) and publishes them.
on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: drive-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply new updates from Drive
        env:
          FOLDER: 1fFECJ8kPrnu70t-xlB6JGoh5_KoiK8jh
        run: |
          set -euo pipefail
          mkdir -p .sync
          SEQ=$(cat .sync/seq 2>/dev/null || echo 0)
          curl -fsSL "https://drive.google.com/embeddedfolderview?id=$FOLDER" -o /tmp/list.html
          python3 - "$SEQ" > /tmp/todo.txt <<'PY'
          import re, sys
          seq = int(sys.argv[1])
          h = open('/tmp/list.html', encoding='utf-8').read()
          items = re.findall(r'/file/d/([\w-]+)/view.*?flip-entry-title">([^<]+)<', h, re.S)
          out = {}
          for fid, name in items:
              m = re.fullmatch(r'([pf])(\d{4})\.(patch|b64)', name.strip())
              if m and int(m.group(2)) > seq:
                  out[int(m.group(2))] = (m.group(1), fid)
          for n in sorted(out):
              print(n, *out[n])
          PY
          cat /tmp/todo.txt
          [ -s /tmp/todo.txt ] || { echo "Nothing new"; exit 0; }
          while read -r N KIND FID; do
            curl -fsSL "https://drive.google.com/uc?export=download&id=$FID" -o /tmp/upd
            if [ "$KIND" = p ]; then git apply --whitespace=nowarn /tmp/upd
            else base64 -d /tmp/upd | tar xz; fi
            grep -q '</html>' europe_trip_planner.html
            grep -q 'var BUILD = "' europe_trip_planner.html
            echo "$N" > .sync/seq
          done < /tmp/todo.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Drive sync to update $(cat .sync/seq)"
          git push
