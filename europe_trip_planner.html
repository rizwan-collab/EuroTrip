      d:"Hidden gem: Seville's ceramics and Roma neighbourhood across the river. Zero tour buses. Locals only.",
      blurb:"Triana is the real Seville — historically the Roma and ceramics district. Workshops still make hand-painted azulejo tiles for sale. Calle Betis is the riverside promenade where locals walk in the evening. Cross the iron Triana bridge, walk Betis end to end, sit at any outdoor bar. Arrive Day 4 afternoon after the train — this is the perfect low-key first Seville experience before the full Day 5 schedule.",tl:1},
    {i:"🏯",city:"Seville",dp:{mi:0.8,min:18,mode:"walk"},
      n:"Real Alcázar Gardens",
      d:"UNESCO royal palace — world-class Mudejar architecture + 7 hectares of gardens. Izyan free under 16. Pre-book.",
      blurb:"The oldest royal palace in continuous use in Europe, built in 1364 over a Moorish fortress. Extraordinary Mudejar tile work, horseshoe arches, carved stucco ceilings. The gardens: 7 hectares of orange trees, peacocks, fountains, hidden pavilions, and mazes. Game of Thrones was filmed here. Izyan free under 16. Pre-book timed entry — queues without reservation run 45+ minutes.",ti:1,tf:1,tb:1},
    {i:"🍽️",city:"Seville",dp:{mi:0.6,min:15,mode:"walk"},
      n:"Lonja del Barranco Food Market",
      d:"Hidden gem: 19th-century iron market restored by Eiffel's firm. 35 local food stalls on the Guadalquivir river.",
      blurb:"A 19th-century iron fish market on the Guadalquivir, restored by Gustavo Eiffel's engineering firm. 35 stalls of local jamón, seafood, Spanish cheese, and tapas — no tourist pricing. The outdoor riverside terrace overlooks the Torre del Oro. Best lunch spot after the Alcázar. 15-min walk via the river path.",tl:1},
    {i:"🕌",city:"Seville",dp:{mi:0.3,min:7,mode:"walk"},

      blurb:"The Giralda is a 12th-century Moorish minaret converted to a bell tower. The 34 ramps were built so the muezzin could ride a horse to the top — Izyan sprints straight to the 104m summit without a single step. Views: the entire city, the Guadalquivir, and the flat Andalusian plain. Book as Cathedral combo ticket. One of Spain's best tower climbs.",ti:1,tb:1},
    {i:"🌊",city:"Seville",dp:{mi:0.6,min:14,mode:"walk"},
      n:"Plaza de España",
      d:"One of Europe's most spectacular plazas — 48 tile alcoves of every Spanish province. Star Wars filmed here. Izyan runs the whole thing.",
      blurb:"Built for the 1929 Ibero-American Exposition: a massive semicircle of terracotta buildings surrounding an ornate moat with four carved bridges. The 48 tile alcoves each depict a different Spanish province — Izyan runs between them reading the blue-and-white maps. Appeared as planet Naboo in Star Wars: Attack of the Clones. Adjacent Maria Luisa Park has peacocks. Free to enter. November: amber sunset light on the terracotta.",ti:1,tf:1},
    {i:"💃",city:"Seville",dp:{mi:0.5,min:12,mode:"walk"},

    {i:"🏰",city:"Granada",dp:{mi:0,min:5,mode:"walk from Parador"},

var sel=1, curtab='it';

function renderTiles(){
  document.getElementById('tiles').innerHTML=opts.map(function(o){
    var wc=o.w==='warm'?'tw':'tm';
    var rc=o.riskClass==='low'?'trisk-low':'trisk-med';
    return '<div class="tile'+(o.n===sel?' sel':'')+'" onclick="pick('+o.n+')">'
      +'<div class="tile-top"><span style="font-size:46px;line-height:1">'+o.f+'</span>'
      +'<div><div class="tile-name">'+o.name+'</div><div class="tile-cities">'+o.cities+'</div></div></div>'
      +'<div class="tile-chips">'
      +'<span class="tchip '+wc+'">'+o.wl+'</span>'
      +'<span class="tchip '+rc+'">'+o.riskSummary.split(' — ')[0]+' '+o.risk+'</span>'
      +'<span class="tchip tnights">📅 '+o.nights+'</span>'
      +'<span class="tprice">💵 $'+o.budget.total.lo.toLocaleString()+'–$'+o.budget.total.hi.toLocaleString()+'</span>'
      +'</div></div>';
  }).join('');
}

function bRow(icon,label,note,lo,hi){
  return '<div class="bline"><span class="bline-cat">'+icon+' <b>'+label+'</b><span class="bline-sub">'+note+'</span></span>'
    +'<span class="bline-amt">$'+lo.toLocaleString()+'–$'+hi.toLocaleString()+'</span></div>';
}

function modeIcon(mode){
  if(!mode) return '';
  var m=mode.toLowerCase();
  if(m.indexOf('walk')>=0) return '🚶';
  if(m.indexOf('metro')>=0||m.indexOf('subway')>=0) return '🚇';
  if(m.indexOf('ferry')>=0||m.indexOf('boat')>=0) return '⛵';
  if(m.indexOf('bus')>=0) return '🚌';
  if(m.indexOf('rer')>=0||m.indexOf('train')>=0) return '🚄';
  return '➡️';
}

    +'<div class="info-box"><div class="info-label">🛡 Safety · 🛂 Visa · 💉 Vaccines</div>'

  } else if(curtab==='kid'){

  } else if(curtab==='bdg'){
    var bdgData=[
      {day:1, date:'Sun Nov 9',  city:'Houston → Lisbon',  items:'Airport food, snacks, lounge', est:70},
      {day:2, date:'Mon Nov 10', city:'Lisbon Day 1',       items:'Lunch + dinner, Bolt x2, Time Out Market', est:140},

function sendItinerary(){
  var o=opts.find(function(x){return x.n===sel;});
  if(window.parent&&window.parent.postMessage){window.parent.postMessage({type:'sendPrompt',text:o.prompt},'*');}
}
function pick(n){sel=n;curtab='it';renderTiles();renderDetail();}
function toggleAct(el){ el.classList.toggle('expanded'); }

function calcBdg(){
  var estData=[70,140,130,80,190,80,120,110,360,180];
  var actTotal=0,estTotal=1280;
  for(var i=1;i<=10;i++){
    var el=document.getElementById('ba'+i);
    var diff=document.getElementById('bd'+i);
    if(el&&diff){
      var v=parseFloat(el.value)||0;
      if(el.value!==''){
        actTotal+=v;
        var d=v-estData[i-1];
        diff.textContent=(d>=0?'+':'')+('$'+Math.abs(d));
        diff.style.color=d>0?'#dc2626':'#16a34a';
        localStorage.setItem('bdg'+i,el.value);
      } else {
        diff.textContent='—';diff.style.color='#9ca3af';
      }
    }
  }
  var rem=estTotal-actTotal;
  var at=document.getElementById('bdg-actual-total');
  var bt=document.getElementById('bdg-diff-total');
  var sa=document.getElementById('bdg-sum-actual');
  var sr=document.getElementById('bdg-sum-rem');
  if(at)at.textContent='$'+actTotal.toFixed(0);
  if(sa)sa.textContent='$'+actTotal.toFixed(0);
  if(sr)sr.textContent=(rem>=0?'$'+rem.toFixed(0):'−$'+Math.abs(rem).toFixed(0));
  if(sr)sr.style.color=rem>=0?'#15803d':'#dc2626';
  if(bt){bt.textContent=(actTotal===0?'—':(actTotal>estTotal?'+$'+(actTotal-estTotal).toFixed(0):'−$'+(estTotal-actTotal).toFixed(0)));bt.style.color=actTotal>estTotal?'#dc2626':'#16a34a';}
}
function loadBdg(){
  for(var i=1;i<=10;i++){
    var v=localStorage.getItem('bdg'+i);
    var el=document.getElementById('ba'+i);
    if(v&&el){el.value=v;}
  }
  calcBdg();
}

function switchtab(t){curtab=t;renderDetail();}
renderTiles();renderDetail();
</script>
